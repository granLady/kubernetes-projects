apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium-node
  template:
    metadata:
      labels:
        app: selenium-node
    spec:
      containers:
        - name: selenium-node
          image: selenium/node-firefox:4.0.0-20220113 # Imagen predeterminada (para el entorno de 'pre')
          env:
            - name: HUB_HOST
              value: "selenium-hub"
            - name: HUB_PORT
              value: "4444"
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: selenium-node
spec:
  ports:
    - port: 5555
      targetPort: 5555
  selector:
    app: selenium-node
  type: LoadBalancer
