apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-chrome
  labels:
    app: selenium
    component: node
    browser: chrome
spec:
  replicas: 2
  selector:
    matchLabels:
      app: selenium
      component: node
      browser: chrome
  template:
    metadata:
      labels:
        app: selenium
        component: node
        browser: chrome
    spec:
      containers:
        - name: selenium-chrome
          image: selenium/standalone-chrome:latest
          env:
            - name: HUB_HOST
              value: selenium-hub
          ports:
            - containerPort: 4444
---
apiVersion: v1
kind: Service
metadata:
  name: selenium-chrome
spec:
  selector:
    app: selenium
    component: node
    browser: chrome
  ports:
    - port: 4444
      targetPort: 4444
  clusterIP: None
