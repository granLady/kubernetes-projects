apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs
provisioner: kubernetes.io/no-provisioner # Le dice a K8s que nosotros creamos los PVs a mano
volumeBindingMode: Immediate # Para que se vinculen rápido

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-jenkins
  labels:
    app.kubernetes.io/instance: jenkins
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs # Coincide con la StorageClass
  volumeMode: Filesystem
  nfs:
    path: /run/media/dani/DATOS/k8s-storage/disco1
    server: 192.168.121.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-jenkins # Asegúrate de que tu Deployment apunte a este nombre exacto
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs # Coincide con la StorageClass
  resources:
    requests:
      storage: 10Gi # Cambiado a 10Gi para emparejar perfectamente el tamaño del PV